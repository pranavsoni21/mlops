name: Fast API Pipeline

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/api.yml'

  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/api.yml'

jobs:
  ci: 
    runs-on: ubuntu-latest

    outputs:
      image: ${{ steps.ecr-push.outputs.image_name }}
      registry: ${{ steps.ecr-push.outputs.ecr_registry }}
      
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4

      - name: Build the docker image
        run: |
          docker build -t student-prediction-api:${{github.sha}} app/

      - name: Scan image with trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          severity: CRITICAL
          image-ref: student-prediction-api:${{github.sha}}
          exit-code: '1'
          ignore-unfixed: true
          

      - name: Configure aws credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-region: "ap-south-1"
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: ECR Login
        id: ecr-login
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/amazon-ecr-login@v2    

      - name: Tag and push image to ECR
        id: ecr-push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
          
        run: |
          IMAGE_URI="${REGISTRY}/${REPOSITORY}:${IMAGE_TAG}"
          
          docker tag \
          student-prediction-api:${IMAGE_TAG} \
          ${REGISTRY}/${REPOSITORY}:${IMAGE_TAG}
          
          docker push ${REGISTRY}/${REPOSITORY}:${IMAGE_TAG}

          echo "image_name=$IMAGE_URI" >> "$GITHUB_OUTPUT"
          echo "ecr_registry=${REGISTRY}" >> "$GITHUB_OUTPUT" 

  cd:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: ci
    environment: production
    
    steps:
      - name: SSH into VM
        env:
          IMAGE: ${{ needs.ci.outputs.image }}
          REGISTRY: ${{ needs.ci.outputs.registry }}
          
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_IP }}
          user: 'ubuntu'
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: IMAGE, REGISTRY
          script: |
            cd ~/mlops/
            aws ecr get-login-password --region ap-south-1 \
            | docker login --username AWS --password-stdin ${REGISTRY}

            # Pull image and run container
            export FASTAPI_IMAGE=${IMAGE}
            docker compose pull fast-api
            docker compose up -d --no-deps fast-api

            # Smoke test
            sleep 5
            curl --fail http://localhost:8000/
    
          

        
